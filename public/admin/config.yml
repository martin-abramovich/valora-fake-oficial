local_backend: true
# ↑ uncomment only for local development (together with `npm run cms`)

backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: solutions
    label: Solutions
    label_singular: Solution
    folder: src/content/solutions
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: order, label: Order, widget: number, hint: "Position in the 3-column grid (1 = first, 6 = last)" }
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - name: images
        label: Images
        widget: list
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alt Text, widget: string }
          - { name: tag, label: Subcategory Tag, widget: string, required: false, hint: "e.g. Metal, Wood, Art — used as the filter on the solution's page. Leave blank to exclude from filtering." }
      - name: category_descriptions
        label: Gallery Filter Descriptions
        widget: list
        required: false
        hint: "Optional text shown when a visitor clicks a tag filter above the gallery. The Tag here must exactly match a Subcategory Tag used above."
        fields:
          - { name: tag, label: Tag, widget: string, hint: "e.g. Metal" }
          - { name: description, label: Description, widget: text }
      - name: documents
        label: Technical Documents
        widget: list
        required: false
        hint: "PDFs or spec sheets shown as download buttons on the solution's page"
        fields:
          - { name: label, label: Button Label, widget: string, hint: 'e.g. "Metal Frames — Spec Sheet"' }
          - { name: file, label: File, widget: file }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: order, label: Order, widget: number, hint: "Position in the projects grid (1 = first)" }
      - { name: name, label: Project Name, widget: string }
      - { name: description, label: Brief Description, widget: text }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Match these to an Artist's Tags to link this project to them on their Artists page (e.g. \"Custom Mirrors\")"
        field: { name: tag, label: Tag, widget: string }
      - name: general_text
        label: General Text
        widget: list
        required: false
        hint: "Longer body copy shown on the project's individual page, below the title"
        field: { name: text, label: Paragraph, widget: text }
      - name: images
        label: Gallery Images
        widget: list
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alt Text, widget: string }

  - name: artists
    label: Artists
    label_singular: Artist
    folder: src/content/artists
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: order, label: Order, widget: number, hint: "Position in the artists grid (1 = first)" }
      - { name: name, label: Name, widget: string }
      - { name: discipline, label: Discipline / Title, widget: string, hint: 'e.g. "Mixed-Media Artist", "Acoustic Sculptor"' }
      - { name: description, label: Brief Description, widget: text, hint: "Shown on the artist's card and at the top of their page" }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Match these to a Project's Tags to link this artist to it (e.g. \"Custom Mirrors\"). Shown as related projects on the artist's page."
        field: { name: tag, label: Tag, widget: string }
      - name: bio
        label: Full Bio
        widget: list
        required: false
        hint: "Longer body copy shown on the artist's individual page, below the title"
        field: { name: text, label: Paragraph, widget: text }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Leave blank to show an initials placeholder" }
      - name: images
        label: Gallery Images
        widget: list
        hint: "Photos of the artist's work"
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alt Text, widget: string }

  - name: team
    label: Team
    label_singular: Team Member
    folder: src/content/team
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: order, label: Order, widget: number, hint: "Position on the Team page (1 = first)" }
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role / Title, widget: string }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Leave blank to show an initials placeholder" }
      - { name: bio, label: Short Bio, widget: text, required: false }

  - name: reps
    label: Sales Reps
    label_singular: Rep
    folder: src/content/reps
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: name, label: Rep Name, widget: string }
      - { name: company, label: Company, widget: string }
      - { name: email, label: Email, widget: string }
      - { name: phone, label: Telephone Number, widget: string }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Leave blank to show an initials placeholder" }
      - name: regions
        label: Regions Covered
        widget: select
        multiple: true
        hint: "Every region this rep is responsible for — one rep can cover several"
        options:
          - { label: Alabama, value: AL }
          - { label: Alaska, value: AK }
          - { label: Arizona, value: AZ }
          - { label: Arkansas, value: AR }
          - { label: California, value: CA }
          - { label: Canada, value: CANADA }
          - { label: Colorado, value: CO }
          - { label: Connecticut, value: CT }
          - { label: Delaware, value: DE }
          - { label: Florida, value: FL }
          - { label: Georgia, value: GA }
          - { label: Hawaii, value: HI }
          - { label: Idaho, value: ID }
          - { label: Illinois, value: IL }
          - { label: Indiana, value: IN }
          - { label: Iowa, value: IA }
          - { label: Kansas, value: KS }
          - { label: Kentucky, value: KY }
          - { label: Louisiana, value: LA }
          - { label: Maine, value: ME }
          - { label: Maryland, value: MD }
          - { label: Massachusetts, value: MA }
          - { label: Michigan, value: MI }
          - { label: Minnesota, value: MN }
          - { label: Mississippi, value: MS }
          - { label: Missouri, value: MO }
          - { label: Montana, value: MT }
          - { label: Nebraska, value: NE }
          - { label: "Nevada (Las Vegas)", value: NV-LV }
          - { label: "Nevada (Northern)", value: NV-N }
          - { label: New Hampshire, value: NH }
          - { label: New Jersey, value: NJ }
          - { label: New Mexico, value: NM }
          - { label: "New York (North)", value: NY-N }
          - { label: "New York (South)", value: NY-S }
          - { label: North Carolina, value: NC }
          - { label: North Dakota, value: ND }
          - { label: Ohio, value: OH }
          - { label: Oklahoma, value: OK }
          - { label: Oregon, value: OR }
          - { label: Pennsylvania, value: PA }
          - { label: Rhode Island, value: RI }
          - { label: South Carolina, value: SC }
          - { label: South Dakota, value: SD }
          - { label: Tennessee, value: TN }
          - { label: Texas, value: TX }
          - { label: Utah, value: UT }
          - { label: Vermont, value: VT }
          - { label: Virginia, value: VA }
          - { label: Washington, value: WA }
          - { label: "Washington D.C.", value: DC }
          - { label: West Virginia, value: WV }
          - { label: Wisconsin, value: WI }
          - { label: Wyoming, value: WY }

  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string, hint: 'Shown as the download button label, e.g. "Custom Mirrors & LED Catalog"' }
      - name: type
        label: Document Type
        widget: select
        options: [Catalog, "Technical Spec Sheet", Other]
      - name: category
        label: Category
        widget: relation
        collection: solutions
        search_fields: [title]
        display_fields: [title]
        value_field: title
        hint: "Pulled from the current Bespoke Solutions — feeds the Category filter on the Resources page"
      - { name: subcategory, label: Subcategory, widget: string, required: false, hint: "e.g. Metal, Wood, Art — ideally matches a Subcategory Tag used on the selected Category's solution page. Leave blank to skip the subcategory filter for this file." }
      - { name: file, label: PDF File, widget: file }

  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: image, label: Photo, widget: image }
      - { name: image_alt, label: Photo Alt Text, widget: string, required: false }
      - { name: date, label: Date, widget: datetime }
      - { name: body, label: Body, widget: markdown }

  - name: settings
    label: Site Content
    files:
      - name: hero
        label: Hero Section
        file: src/content/settings/hero.json
        fields:
          - { name: published, label: "Show this section on the site?", widget: boolean, default: true }
          - { name: headline_before_em, label: "Headline — start", widget: string, required: false, hint: 'e.g. "Mastery "' }
          - { name: headline_em, label: "Headline — italic word", widget: string, hint: 'e.g. "in"' }
          - { name: headline_after_em, label: "Headline — end", widget: string, required: false, hint: 'e.g. " every detail."' }
          - { name: body, label: Body Text, widget: text, hint: "Each line break becomes a new line on screen" }
          - name: background_images
            label: Background Images (slider)
            widget: list
            min: 1
            hint: "Rotates automatically every 5 seconds, in order. Add as many as you want."
            field: { name: src, label: Image, widget: image }

      - name: about
        label: About Section
        file: src/content/settings/about.json
        fields:
          - { name: published, label: "Show this section on the home page and publish the /about page?", widget: boolean, default: true, hint: "Turning this off hides the homepage teaser AND takes the full About page offline." }
          - { name: eyebrow, label: "Homepage Teaser — Eyebrow Text", widget: string }
          - { name: heading_before_em, label: "Homepage Teaser — Heading (before italic)", widget: string, required: false, hint: "Also shown as the closing tagline at the bottom of the full About page" }
          - { name: heading_em, label: "Homepage Teaser — Heading (italic word)", widget: string }
          - { name: heading_after_em, label: "Homepage Teaser — Heading (after italic)", widget: string, required: false }
          - name: paragraphs
            label: "Homepage Teaser — Body Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: image, label: "Homepage Teaser — Image", widget: image }
          - { name: image_alt, label: "Homepage Teaser — Image Alt Text", widget: string }

          - { name: page_eyebrow, label: "About Page — Eyebrow Text", widget: string }
          - { name: page_heading, label: "About Page — Main Heading", widget: string }

          - { name: section1_heading, label: "About Page — Section 1 Heading (The Origin & Role)", widget: string }
          - name: section1_paragraphs
            label: "About Page — Section 1 Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: section1_image, label: "About Page — Section 1 Image", widget: image }
          - { name: section1_image_alt, label: "About Page — Section 1 Image Alt Text", widget: string }

          - { name: section2_heading, label: "About Page — Section 2 Heading", widget: string }
          - { name: section2_intro, label: "About Page — Section 2 Intro Text", widget: text }
          - name: section2_items
            label: "About Page — Section 2 Feature List"
            widget: list
            hint: "e.g. Dedicated In-House Artisans, End-to-End Domestic Craft, Deliberate Materiality"
            fields:
              - { name: label, label: Item Label, widget: string }
              - { name: text, label: Item Text, widget: text }
          - { name: section2_image, label: "About Page — Section 2 Background Photo", widget: image, hint: "Short full-width photo band behind the heading + intro text — a visual pause between sections" }
          - { name: section2_image_alt, label: "About Page — Section 2 Photo Alt Text", widget: string }

          - { name: section3_heading, label: "About Page — Section 3 Heading (Leadership Behind the Brand)", widget: string }
          - name: section3_paragraphs
            label: "About Page — Section 3 Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: section3_image, label: "About Page — Section 3 Image", widget: image }
          - { name: section3_image_alt, label: "About Page — Section 3 Image Alt Text", widget: string }
          - { name: section3_cta_label, label: "About Page — Section 3 Button Label", widget: string, hint: 'Links to the Team page, e.g. "Meet the Team"' }

      - name: art-curation
        label: Art Curation Section
        file: src/content/settings/art-curation.json
        fields:
          - { name: published, label: "Show this section on the home page and publish the /art-curation page?", widget: boolean, default: true, hint: "Turning this off hides the homepage teaser AND takes the full Art Curation page offline." }
          - { name: eyebrow, label: "Homepage Teaser — Eyebrow Text", widget: string }
          - { name: heading_before_em, label: "Homepage Teaser — Heading (before italic)", widget: string, required: false }
          - { name: heading_em, label: "Homepage Teaser — Heading (italic word)", widget: string }
          - { name: heading_after_em, label: "Homepage Teaser — Heading (after italic)", widget: string, required: false }
          - name: paragraphs
            label: "Homepage Teaser — Body Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: image, label: "Homepage Teaser — Image", widget: image }
          - { name: image_alt, label: "Homepage Teaser — Image Alt Text", widget: string }
          - { name: video_url, label: "Art Curation Page — Background Video (Vimeo Embed URL)", widget: string, hint: "From Vimeo: Share → Embed, copy the iframe's src URL, e.g. https://player.vimeo.com/video/123456789?h=abcdef" }
          - name: video_captions
            label: "Art Curation Page — Video Overlay Captions"
            widget: list
            min: 1
            hint: "Short lines shown over the video, fading from one to the next automatically every few seconds"
            field: { name: text, label: Caption, widget: string }
          - { name: page_heading, label: "Art Curation Page — Body Heading", widget: string }
          - name: page_paragraphs
            label: "Art Curation Page — Body Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }

      - name: projects
        label: Projects Section
        file: src/content/settings/projects.json
        fields:
          - { name: published, label: "Show this section on the home page and publish the /projects page?", widget: boolean, default: true, hint: "Turning this off hides the homepage teaser AND takes the full Projects page offline." }
          - { name: eyebrow, label: "Homepage Teaser — Eyebrow Text", widget: string }
          - { name: heading_before_em, label: "Homepage Teaser — Heading (before italic)", widget: string, required: false }
          - { name: heading_em, label: "Homepage Teaser — Heading (italic word)", widget: string }
          - { name: heading_after_em, label: "Homepage Teaser — Heading (after italic)", widget: string, required: false }
          - name: paragraphs
            label: "Homepage Teaser — Body Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: image, label: "Homepage Teaser — Image", widget: image }
          - { name: image_alt, label: "Homepage Teaser — Image Alt Text", widget: string }
          - { name: page_heading, label: "Projects Page — Heading", widget: string }
          - { name: page_description, label: "Projects Page — Description", widget: text }

      - name: artists
        label: Artists Section
        file: src/content/settings/artists.json
        fields:
          - { name: published, label: "Show this section on the home page and publish the /artists page?", widget: boolean, default: true, hint: "Turning this off hides the homepage teaser AND takes the full Artists page offline." }
          - { name: eyebrow, label: "Homepage Teaser — Eyebrow Text", widget: string }
          - { name: heading_before_em, label: "Homepage Teaser — Heading (before italic)", widget: string, required: false }
          - { name: heading_em, label: "Homepage Teaser — Heading (italic word)", widget: string }
          - { name: heading_after_em, label: "Homepage Teaser — Heading (after italic)", widget: string, required: false }
          - name: paragraphs
            label: "Homepage Teaser — Body Paragraphs"
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: image, label: "Homepage Teaser — Image", widget: image }
          - { name: image_alt, label: "Homepage Teaser — Image Alt Text", widget: string }
          - { name: page_heading, label: "Artists Page — Heading", widget: string }
          - { name: page_description, label: "Artists Page — Description", widget: text }

      - name: team
        label: Team Section
        file: src/content/settings/team.json
        fields:
          - { name: published, label: "Show this section on the home page and publish the /team page?", widget: boolean, default: true, hint: "Turning this off hides the homepage teaser AND takes the full Team page offline." }
          - { name: heading, label: "Homepage Teaser — Heading", widget: string }
          - { name: description, label: "Homepage Teaser — Description", widget: text }
          - { name: image, label: "Homepage Teaser — Image", widget: image }
          - { name: image_alt, label: "Homepage Teaser — Image Alt Text", widget: string }
          - { name: page_heading, label: "Team Page — Heading", widget: string }
          - { name: page_description, label: "Team Page — Description", widget: text }

      - name: resources
        label: Resources Page
        file: src/content/settings/resources.json
        fields:
          - { name: published, label: "Publish the /resources page?", widget: boolean, default: true }
          - { name: page_heading, label: "Page Heading", widget: string }
          - { name: page_description, label: "Page Description", widget: text }

      - name: join-team
        label: "Artist Submissions Section"
        file: src/content/settings/join-team.json
        fields:
          - { name: published, label: "Show this section on the site?", widget: boolean, default: true }
          - { name: heading_before_em, label: "Heading — start", widget: string, required: false, hint: 'Text before the italic phrase, e.g. "Join our team of ". Leave blank to start with the italic phrase.' }
          - { name: heading_em, label: "Heading — italic phrase", widget: string, required: false, hint: 'Accent word/phrase in script font, e.g. "Artist"' }
          - { name: heading_after_em, label: "Heading — end", widget: string, required: false, hint: 'Text after the italic phrase, e.g. " Submissions"' }
          - { name: body, label: "Body Text", widget: string, hint: 'Text shown before the email link, e.g. "Send us your portfolio to"' }
          - { name: email, label: "Contact Email", widget: string }

      - name: contact
        label: Contact Section
        file: src/content/settings/contact.json
        fields:
          - { name: published, label: "Show this section on the site?", widget: boolean, default: true }
          - { name: heading_before_em, label: "Heading — before italic", widget: string, required: false }
          - { name: heading_em, label: "Heading — italic word", widget: string }
          - { name: body, label: Body Text, widget: text }
          - name: roles
            label: Role Options
            widget: list
            field: { name: value, label: Option, widget: string }
          - name: project_types
            label: Project Type Options
            widget: list
            field: { name: value, label: Option, widget: string }
          - name: project_stages
            label: Project Stage Options
            widget: list
            field: { name: value, label: Option, widget: string }

      - name: footer
        label: Footer
        file: src/content/settings/footer.json
        fields:
          - { name: tagline, label: Tagline, widget: string, hint: 'Separate phrases with " · " (space · space)' }
          - { name: background_image, label: Background Image, widget: image }
